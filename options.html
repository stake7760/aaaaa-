<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Configurações - Haxball Extension</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 32px;
      min-height: 100vh;
    }

    h1 {
      font-size: 22px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }

    .section {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 20px;
      max-width: 480px;
    }

    .section h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #4fc3f7;
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .row:last-child { margin-bottom: 0; }

    .row label {
      font-size: 14px;
      color: #ccc;
      flex: 1;
    }

    .row input {
      width: 60px;
      text-align: center;
      background: #0f3460;
      border: 1px solid #1a5276;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
      padding: 6px 8px;
      outline: none;
      cursor: pointer;
    }

    .row input:focus {
      border-color: #4fc3f7;
      background: #1a3a5c;
    }

    .row input.listening {
      border-color: #f39c12;
      background: #3d2b00;
      color: #f39c12;
    }

    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      margin-bottom: 14px;
    }

    button#save {
      background: #0f3460;
      border: 1px solid #4fc3f7;
      color: #4fc3f7;
      padding: 10px 28px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button#save:hover { background: #1a5276; }

    #status {
      display: inline-block;
      margin-left: 14px;
      font-size: 13px;
      color: #2ecc71;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #status.show { opacity: 1; }
  </style>
</head>
<body>

  <h1>Haxball Extension</h1>
  <p class="subtitle">Configure as teclas de atalho para troca de câmera.</p>

  <div class="section">
    <h2>Troca de Câmera</h2>
    <p class="hint">Clique no campo e pressione a tecla desejada. Deixe vazio para desativar.</p>

    <div class="row"><label>Full 1x Zoom</label><input type="text" data-zoom="Full 1x Zoom" readonly placeholder="—"></div>
    <div class="row"><label>Full 1.25x Zoom</label><input type="text" data-zoom="Full 1.25x Zoom" readonly placeholder="—"></div>
    <div class="row"><label>Full 1.5x Zoom</label><input type="text" data-zoom="Full 1.5x Zoom" readonly placeholder="—"></div>
    <div class="row"><label>Full 1.75x Zoom</label><input type="text" data-zoom="Full 1.75x Zoom" readonly placeholder="—"></div>
    <div class="row"><label>Full 2x Zoom</label><input type="text" data-zoom="Full 2x Zoom" readonly placeholder="—"></div>
    <div class="row"><label>Full 2.25x Zoom</label><input type="text" data-zoom="Full 2.25x Zoom" readonly placeholder="—"></div>
    <div class="row"><label>Full 2.5x Zoom</label><input type="text" data-zoom="Full 2.5x Zoom" readonly placeholder="—"></div>
    <div class="row"><label>Full 2.75x Zoom</label><input type="text" data-zoom="Full 2.75x Zoom" readonly placeholder="—"></div>
  </div>

  <button id="save">Salvar</button>
  <span id="status">✓ Salvo!</span>

  <script>
    const inputs = document.querySelectorAll('input[data-zoom]');

    // Carrega bindings salvos
    chrome.storage.sync.get('cameraBindings', function (data) {
      const bindings = data.cameraBindings || {};
      inputs.forEach(input => {
        const zoom = input.dataset.zoom;
        if (bindings[zoom]) input.value = bindings[zoom];
      });
    });

    // Captura tecla ao clicar no input
    inputs.forEach(input => {
      input.addEventListener('focus', function () {
        input.value = '';
        input.classList.add('listening');
        input.placeholder = '...';
      });

      input.addEventListener('keydown', function (e) {
        e.preventDefault();
        if (e.key === 'Escape') {
          input.value = '';
          input.blur();
          return;
        }
        if (e.key === 'Backspace' || e.key === 'Delete') {
          input.value = '';
          input.blur();
          return;
        }
        input.value = e.key;
        input.blur();
      });

      input.addEventListener('blur', function () {
        input.classList.remove('listening');
        input.placeholder = '—';
      });
    });

    // Salva
    document.getElementById('save').addEventListener('click', function () {
      const bindings = {};
      inputs.forEach(input => {
        if (input.value) bindings[input.dataset.zoom] = input.value;
      });
      chrome.storage.sync.set({ cameraBindings: bindings }, function () {
        const status = document.getElementById('status');
        status.classList.add('show');
        setTimeout(() => status.classList.remove('show'), 2000);
      });
    });
  </script>
</body>
</html>
